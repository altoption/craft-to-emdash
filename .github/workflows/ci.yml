name: ci
# A pull request's branch is checked once, as the pull request; a push is checked only on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A seed that validates can still fail to apply, so the built CLI's output goes into a real EmDash database.
      - name: Convert the fixture and apply its seed to EmDash
        run: |
          node dist/cli.js schema test/fixtures/basic --out out
          npx emdash seed out/seed.json --database out/check.db --uploads-dir out/uploads --no-content
