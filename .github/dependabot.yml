version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # the EmDash packages are released together and must match
      emdash:
        patterns: ["emdash", "@emdash-cms/*"]
      dev:
        dependency-type: development
        exclude-patterns: ["emdash", "@emdash-cms/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
